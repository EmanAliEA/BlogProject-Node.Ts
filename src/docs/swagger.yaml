openapi: 3.0.0
info:
  title: BlogProject API
  version: 1.0.0
  description: API documentation for the BlogProject Node.js/TypeScript backend.
servers:
  - url: http://localhost:3000
    description: Local server
tags:
  - name: Blogs
    description: Operations related to blog posts
  - name: Auth
    description: Authentication and user management
components:
  securitySchemes:
    auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Blog:
      type: object
      properties:
        _id:
          type: string
          example: 609c0b8f2f8fb814b56fa181
        title:
          type: string
          example: My First Blog Post
        content:
          type: string
          example: This is the content of my first blog post.
        category:
          type: string
          example: Technology
        user_id:
          type: string
          example: 609c0b8f2f8fb814b56fa100

    User:
      type: object
      properties:
        _id:
          type: string
          example: 609c0b8f2f8fb814b56fa100
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: johndoe@example.com
        password:
          type: string
          example: Password123

security:
  - auth: []
paths:
  /blogs:
    post:
      tags:
        - Blogs
      summary: Create a new blog post
      security:
        - auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '200':
          description: The created blog post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
        '400':
          description: Bad request.
        '401':
          description: Unauthorized access.
    get:
      tags:
        - Blogs
      summary: Get all blogs
      security:
        - auth: []
      responses:
        '200':
          description: A list of blogs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blog'
  /blogs/{id}:
    put:
      tags:
        - Blogs
      summary: Update a blog post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the blog post to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '200':
          description: The updated blog post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
        '404':
          description: Blog not found.
        '403':
          description: You are not allowed to update this blog post.
        '400':
          description: No data provided to update.
    delete:
      tags:
        - Blogs
      summary: Delete a blog post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The ID of the blog post to delete
      responses:
        '204':
          description: Blog post deleted successfully.
        '400':
          description: Blog post not found.
        '403':
          description: You are not allowed to delete this blog post.
        '401':
          description: Unauthorized access.
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request or user already exists.
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@example.com
                password:
                  type: string
                  example: Password123
      responses:
        '200':
          description: Login successful, returns JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid email or password.
